plugins {
    id 'com.android.application'
}

android {
    namespace 'in.monarch.workspace'
    compileSdk 35

    defaultConfig {
        applicationId 'in.monarch.workspace'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    // This makes the release variant installable in CI without requiring a
    // private signing key. For Play Store distribution, replace this with a
    // stable private release key stored in protected CI secrets.
    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
