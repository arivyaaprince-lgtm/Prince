name: Check Monarch backend
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/check-backend.yml"
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/check-backend.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
