name: Build Monarch Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "mobile/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

concurrency:
  group: monarch-android-apk
  cancel-in-progress: true

jobs:
  build-android:
    name: Build installable Monarch APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare local-first web assets
        run: |
          test -f app/index.html
          mkdir -p mobile/www
          cp -R app/. mobile/www/
          test -f mobile/www/index.html

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm install

      - name: Generate Android project
        working-directory: mobile
        run: npx cap add android

      - name: Sync packaged assets
        working-directory: mobile
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Stage and verify APK
        run: |
          mkdir -p dist
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk dist/Monarch-debug.apk
          test -s dist/Monarch-debug.apk
          cd dist
          zip -j Monarch-Android.zip Monarch-debug.apk
          test -s Monarch-Android.zip

      - name: Upload APK and ZIP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Monarch-Android-Downloads
          path: |
            dist/Monarch-debug.apk
            dist/Monarch-Android.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK and ZIP downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: monarch-android-latest
          name: Monarch for Android
          body: |
            Monarch Android debug APK and a ZIP-wrapped copy as an alternative download route.

            Local project creation, editing, preview, browser-local saving, and export are bundled in the app and do not need Render.
            Online AI chat remains optional and requires a separately configured compatible backend.

            This APK is for direct testing and is not a Play Store release.
          files: |
            dist/Monarch-debug.apk
            dist/Monarch-Android.zip
          overwrite_files: true
          make_latest: false
