name: Build Monarch Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "mobile/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

concurrency:
  group: monarch-android-apk
  cancel-in-progress: true

jobs:
  build-android:
    name: Build and verify installable Monarch APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare local-first web assets
        run: |
          test -f app/index.html
          mkdir -p mobile/www
          cp -R app/. mobile/www/
          test -s mobile/www/index.html

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm install

      - name: Generate Android project
        working-directory: mobile
        run: npx cap add android

      - name: Sync packaged assets
        working-directory: mobile
        run: npx cap sync android

      - name: Build release variant
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Sign and verify installable APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -s "$APK" ]; then
            APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          fi
          test -s "$APK"
          mkdir -p dist signing
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ] && [ -n "${RELEASE_KEYSTORE_PASSWORD:-}" ] && [ -n "${RELEASE_KEY_ALIAS:-}" ] && [ -n "${RELEASE_KEY_PASSWORD:-}" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > signing/release.jks
            KEYSTORE_PASSWORD="$RELEASE_KEYSTORE_PASSWORD"
            KEY_ALIAS="$RELEASE_KEY_ALIAS"
            KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
            echo "Using configured persistent release signing key."
          else
            echo "::warning::No persistent release signing secrets configured. Generating a temporary key; this APK is installable, but future builds may not update it in place."
            keytool -genkeypair -v -keystore signing/temporary-release.jks -storepass monarch-temp-pass -keypass monarch-temp-pass -alias monarch -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Monarch App, OU=Android, O=Monarch, L=Unknown, ST=Unknown, C=IN"
            mv signing/temporary-release.jks signing/release.jks
            KEYSTORE_PASSWORD="monarch-temp-pass"
            KEY_ALIAS="monarch"
            KEY_PASSWORD="monarch-temp-pass"
          fi
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" dist/Monarch-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks signing/release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --out dist/Monarch.apk dist/Monarch-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs dist/Monarch.apk
          "$BUILD_TOOLS/aapt" dump badging dist/Monarch.apk | tee dist/apk-metadata.txt
          grep -q "^package:" dist/apk-metadata.txt
          test -s dist/Monarch.apk
          sha256sum dist/Monarch.apk | tee dist/SHA256SUMS.txt
          rm -f dist/Monarch-aligned.apk

      - name: Upload direct APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monarch-APK
          path: |
            dist/Monarch.apk
            dist/SHA256SUMS.txt
            dist/apk-metadata.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: monarch-android-build-${{ github.run_number }}
          name: Monarch for Android — Build ${{ github.run_number }}
          body: |
            Direct installable Monarch APK. The workflow builds the release variant, aligns it, signs it, verifies the APK signature, and checks Android package metadata.

            Local project creation, editing, preview, browser-local saving, and export are bundled in the app and do not need Render. Online AI chat remains optional and requires a separately configured compatible backend.

            For persistent in-place updates, configure RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, and RELEASE_KEY_PASSWORD repository Actions secrets with your own long-term signing key. If those are absent, the workflow creates a temporary signing key for this build.
          files: |
            dist/Monarch.apk
            dist/SHA256SUMS.txt
          overwrite_files: false
          make_latest: false
