name: Build Monarch Android release
run-name: Build Monarch release APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-monarch-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease
        working-directory: android
      - name: Prepare direct download
        run: cp android/app/build/outputs/apk/release/app-release.apk Monarch.apk
      - name: Publish APK as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="monarch-v${{ github.run_number }}"
          gh release create "$TAG" Monarch.apk \
            --repo "${{ github.repository }}" \
            --title "Monarch Android ${{ github.run_number }}" \
            --notes "Installable Android release APK for Monarch. Built from commit ${{ github.sha }}."
      - name: Keep APK artifact as a backup
        uses: actions/upload-artifact@v4
        with:
          name: monarch-release-apk
          path: Monarch.apk
          if-no-files-found: error
          retention-days: 30
