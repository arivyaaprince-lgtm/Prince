name: Verify Monarch backend and portable image
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "app/**"
      - "package.json"
      - "tsconfig.json"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/verify-backend.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build backend
        run: npm run build
      - name: Build portable Docker image
        run: docker build -t monarch:ci .
